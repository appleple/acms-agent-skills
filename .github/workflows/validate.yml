name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: スキルと marketplace.json の検証
        run: node scripts/validate-skills.mjs
      - name: シェルスクリプトの構文チェック
        run: |
          find skills -name '*.sh' -print0 | xargs -0 -r -n1 sh -n
